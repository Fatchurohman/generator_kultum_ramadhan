<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generator Kultum Ramadhan Lengkap</title>
    <style>
        :root {
            --bg-primary: #0a2f1d;
            --bg-secondary: #124029;
            --accent-gold: #d4af37;
            --accent-gold-light: #f3e5ab;
            --text-light: #ffffff;
            --text-dark: #111111;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-light);
            min-height: 100vh;
            padding: 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            background: linear-gradient(135deg, var(--bg-secondary), #061c11);
            border: 2px solid var(--accent-gold);
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        h1 {
            color: var(--accent-gold);
            font-size: 1.8rem;
            text-shadow: 1px 1px 2px #000;
        }

        .developer-tag {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            color: var(--accent-gold-light);
            background: rgba(0,0,0,0.3);
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid var(--accent-gold);
        }

        .live-dot {
            width: 10px;
            height: 10px;
            background-color: #ff3333;
            border-radius: 50%;
            display: inline-block;
            animation: blink 1s infinite;
            box-shadow: 0 0 8px #ff3333;
        }

        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0.2; }
            100% { opacity: 1; }
        }

        .container {
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

        .sidebar {
            background: var(--bg-secondary);
            border: 1px solid var(--accent-gold);
            border-radius: 10px;
            padding: 15px;
            max-height: 85vh;
            overflow-y: auto;
        }

        .filter-container {
            margin-bottom: 15px;
        }

        select {
            width: 100%;
            padding: 10px;
            background-color: var(--bg-primary);
            color: var(--accent-gold-light);
            border: 1px solid var(--accent-gold);
            border-radius: 5px;
            outline: none;
        }

        .item-list {
            list-style: none;
        }

        .item-list li {
            padding: 12px;
            margin-bottom: 8px;
            background: rgba(0,0,0,0.2);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.95rem;
        }

        .item-list li:hover, .item-list li.active {
            background: var(--accent-gold);
            color: var(--text-dark);
            font-weight: bold;
        }

        .main-content {
            background: var(--bg-secondary);
            border: 1px solid var(--accent-gold);
            border-radius: 10px;
            padding: 25px;
            min-height: 85vh;
        }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            background-color: var(--accent-gold);
            color: var(--text-dark);
            border-radius: 15px;
            font-size: 0.8rem;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .content-title {
            color: var(--accent-gold);
            margin-bottom: 15px;
            font-size: 1.6rem;
        }

        .tab-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--accent-gold);
            padding-bottom: 10px;
        }

        .tab-btn {
            background: transparent;
            color: var(--text-light);
            border: 1px solid var(--accent-gold);
            padding: 8px 16px;
            border-radius: 5px;
            cursor: pointer;
        }

        .tab-btn.active {
            background: var(--accent-gold);
            color: var(--text-dark);
            font-weight: bold;
        }

        .redaksi-box {
            background: rgba(0,0,0,0.25);
            padding: 25px;
            border-radius: 8px;
            border-left: 4px solid var(--accent-gold);
            line-height: 1.9;
            margin-bottom: 20px;
            white-space: pre-line;
            font-size: 1.05rem;
        }

        .arabic-text {
            font-family: 'Amiri', 'Traditional Arabic', 'Naskh', serif;
            font-size: 1.4rem;
            direction: rtl;
            text-align: right;
            margin: 10px 0;
            color: var(--accent-gold-light);
            line-height: 2.2;
        }

        .dalil-box {
            background: rgba(212, 175, 55, 0.1);
            border: 1px dashed var(--accent-gold);
            padding: 15px;
            border-radius: 5px;
            margin: 15px 0;
            font-style: italic;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-gold {
            background: linear-gradient(135deg, #d4af37, #f3e5ab);
            color: var(--text-dark);
        }

        .btn-gold:hover {
            filter: brightness(1.1);
        }

        .empty-state {
            text-align: center;
            padding: 50px;
            color: var(--accent-gold-light);
        }

        /* Print Style */
        @media print {
            body {
                background-color: #fff;
                color: #000;
            }
            header, .sidebar, .tab-buttons, .action-buttons, .filter-container {
                display: none !important;
            }
            .container {
                display: block;
            }
            .main-content {
                border: none;
                background: #fff;
                color: #000;
                padding: 0;
            }
            .content-title {
                color: #000;
            }
            .redaksi-box {
                background: #fff;
                color: #000;
                border-left: 2px solid #000;
            }
            .arabic-text {
                color: #000;
            }
            .dalil-box {
                background: #fff;
                color: #000;
                border: 1px solid #000;
            }
            .badge {
                border: 1px solid #000;
                background: #fff;
                color: #000;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>Generator Kultum Ramadhan (Lengkap 10 Menit)</h1>
        <div class="developer-tag">
            <span class="live-dot"></span>
            <span>developer : fatur62</span>
        </div>
    </header>

    <div class="container">
        <div class="sidebar">
            <div class="filter-container">
                <select id="categoryFilter">
                    <option value="ALL">-- Semua Kategori (50 Judul) --</option>
                    <option value="Aqidah">Aqidah (1-9)</option>
                    <option value="Ibadah">Ibadah (10-18)</option>
                    <option value="Muamalah">Muamalah (19-26)</option>
                    <option value="Akhlak">Akhlak (27-34)</option>
                    <option value="Jinayat">Jinayat (35-42)</option>
                    <option value="Siyasah">Siyasah (43-50)</option>
                </select>
            </div>
            <ul class="item-list" id="kultumList"></ul>
        </div>

        <div class="main-content" id="mainContent">
            <div class="empty-state">
                <h2>Pilih Judul Kultum</h2>
                <p>Silakan pilih salah satu dari 50 judul kultum untuk menampilkan uraian naskah lengkap (durasi 7-10 menit) beserta dalil dan pilihan redaksinya.</p>
            </div>
        </div>
    </div>

    <script>
        // Fungsi Generator Template Naskah Utuh Durasi 7-10 Menit (~700 Kata)
        function buildFullScript(judul, kategori, dalil, temaUtama, penjelas, kutipanUlama, redaksiTipe) {
            if (redaksiTipe === 1) {
                return `Assalamu'alaikum Warahmatullahi Wabarakatuh.

Alhamdulillahi rabbil 'alamin, was shalatu was salamu 'ala asyrafil anbiya'i wal mursalin, sayyidina wa maulana Muhammadin, wa 'ala alihi wa shahbihi ajma'in. Amma ba'du.

Jamaah shalat dan kultum Ramadhan yang dirahmati Allah SWT,

Puji dan syukur marilah kita panjatkan kehadirat Allah SWT yang telah memberikan kita nikmat iman, islam, serta kesempatan untuk berada di bulan suci Ramadhan yang penuh berkah ini. Shalawat serta salam semoga senantiasa tercurah kepada junjungan kita Nabi Agung Muhammad SAW, keluarga, sahabat, dan pengikutnya hingga akhir zaman.

Pada kesempatan yang berbahagia ini, tema yang akan kita bahas adalah mengenai "${judul}".

Hadirin yang dimuliakan Allah,
Tema ini tergolong ke dalam aspek ${kategori} yang sangat krusial dalam kehidupan seorang muslim. Dalam Al-Qur'an dan Hadits, landasan utama dari pembahasan ini tertuang secara jelas:

"${dalil}"

Dari dalil di atas, kita dapat memahami betapa pentingnya ${temaUtama}. Para ulama menjelaskan bahwa ${penjelas}. 

Imam Hasan al-Bashri rahimahullah pernah menyatakan terkait hal ini:
"${kutipanUlama}"

Hadirin wal jamaah rahimakumullah,
Mengapa poin ini menjadi sangat vital, khususnya di bulan Ramadhan? Karena di bulan yang mulia ini, setiap amalan kita dilipatgandakan. Ketika kita menjalankan ibadah puasa, kita tidak hanya dituntut untuk menahan lapar dan dahaga, tetapi juga disyariatkan untuk memperbaiki kualitas ${kategori} kita secara keseluruhan.

Ada tiga langkah praktis yang bisa kita terapkan selama bulan Ramadhan ini:

Pertama, Melakukan Evaluasi Diri (Muhasabah). Jangan sampai hari-hari Ramadhan berlalu tanpa ada perubahan nyata dalam sikap dan pola pikir kita.
Kedua, Memperdalam Ilmu Syar'i. Pemahaman yang benar terhadap dalil akan melahirkan pengamalan yang ikhlas dan sesuai sunnah.
Ketiga, Istiqamah. Amalan yang sedikit namun berkelanjutan jauh lebih dicintai Allah daripada amalan besar yang hanya dilakukan sesekali.

Sebagai penutup, marilah kita senantiasa memohon petunjuk dan kekuatan dari Allah SWT agar kita dijadikan hamba-hamba-Nya yang berhasil memetik hikmah dan keberkahan Ramadhan secara utuh.

Wabillahi taufiq wal hidayah,
Wassalamu'alaikum Warahmatullahi Wabarakatuh.`;
            } else {
                return `Assalamu'alaikum Warahmatullahi Wabarakatuh.

Alhamdulillahilladzi hadana lihadza wa ma kunna linatadiya laula an hadanallah. Asyhadu alla ilaha illallah wahdahu la syarika lah, wa asyhadu anna Muhammadan 'abduhu wa rasuluhu la nabiya ba'dah.

Ingkang kinurmatan para jamaah sekalian,

Marilah kita tingkatkan ketakwaan kita kepada Allah SWT dengan ketakwaan yang sebenar-benarnya, yaitu dengan menjalankan segala perintah-Nya dan menjauhi segala larangan-Nya. Lebih-lebih di dalam bulan Ramadhan yang penuh maghfirah ini.

Kultum kita pada kesempatan kali ini mengangkat topik: "${judul}".

Para jamaah yang dirahmati Allah,
Jika kita mengkaji bidang ${kategori}, masalah ini memegang peranan yang sangat fundamental. Allah SWT telah memperingatkan kita melalui nash Al-Qur'an / Hadits berikut:

"${dalil}"

Penjelasan mendalam mengenai dalil tersebut sebagaimana disampaikan oleh Syekh Ibn Hajar al-Asqalani/Imam An-Nawawi rahimahullah bahwa: ${penjelas}.

Prinsip ${temaUtama} ini juga selaras dengan perkataan ulama mu'ashir/halaf yang menegaskan:
"${kutipanUlama}"

Hadirin yang bahagia,
Di tengah kehidupan modern saat ini, implementasi dari pesan moral di atas sering kali menghadapi tantangan berat. Oleh karena itu, Ramadhan hadir sebagai madrasah rohani untuk membentuk kembali disiplin kita. 

Di antara hikmah terbesar yang bisa kita petik adalah:
1. Membenteng diri dari pengaruh buruk lingkungan sekitar.
2. Menjadikan ibadah puasa sebagai sarana penyucian jiwa dan perbaikan hubungan muamalah antar sesama.
3. Menumbuhkan rasa empati dan kesadaran hukum dalam bertindak sehari-hari.

Semoga Allah SWT menerima seluruh rangkaian ibadah puasa, shalat malam, dan amal saleh kita, serta membimbing kita menjadi pribadi yang makin bertaqwa setelah Ramadhan berlalu.

Aamiin Ya Rabbal 'Alamin.
Wassalamu'alaikum Warahmatullahi Wabarakatuh.`;
            }
        }

        // Database 50 Judul Terstruktur Lengkap
        const kultumData = [
            // AQIDAH (1-9)
            { id: 1, k: "Aqidah", j: "Pembersihan Jiwa Melalui Tauhid di Bulan Ramadhan", d: "QS. Al-Baqarah: 183 & HR. Bukhari Muslim", t: "pemurnian tauhid dari segala bentuk kesyirikan", p: "Puasa adalah ibadah rahasia yang melatih kejujuran iman hanya kepada Allah", u: "Iman itu tidak cukup hanya dengan angan-angan, melainkan apa yang menancap di dalam hati dan dibuktikan dengan amal." },
            { id: 2, k: "Aqidah", j: "Meningkatkan Iman dan Taqwa Melalui Puasa", d: "QS. Ali Imran: 133", t: "proses pembentukan derajat muttaqin", p: "Taqwa adalah benteng utama seorang muslim dari godaan maksiat", u: "Taqwa adalah rasa takut kepada Allah yang Maha Agung, beramal dengan Al-Qur'an, dan ridha dengan yang sedikit." },
            { id: 3, k: "Aqidah", j: "Mengenal Allah Melalui Asmaul Husna Saat Berpuasa", d: "QS. Al-A'raf: 180", t: "penghayatan nama dan sifat Allah", p: "Meneladani sifat Ar-Rahman dan Ar-Rahim dalam interaksi sosial saat puasa", u: "Barangsiapa menghafal dan menghayati Asmaul Husna maka ia akan masuk surga." },
            { id: 4, k: "Aqidah", j: "Menjaga Keikhlasan Niat di Bulan Suci", d: "HR. Bukhari & Muslim (Innamal a'malu binniyat)", t: "penataan niat ibadah secara murni", p: "Niat adalah Ruh dari setiap amal perbuatan manusia", u: "Berapa banyak amal kecil menjadi besar karena niat, dan amal besar menjadi kecil karena niat." },
            { id: 5, k: "Aqidah", j: "Bahaya Syirik Khafi (Tersembunyi) Saat Beribadah", d: "QS. Al-Kahf: 110", t: "penjagaan dari riya' dan ujub", p: "Riya' merusak pahala ibadah puasa dan tarawih secara perlahan", u: "Syirik khafi lebih samar daripada langkah semut hitam di atas batu hitam pada malam gelap." },
            { id: 6, k: "Aqidah", j: "Meyakini Janji Allah Bagi Orang yang Berpuasa", d: "HR. Bukhari (Man shama ramadhana imanan wa ihtisaban)", t: "keyakinan akan pengampunan dosa", p: "Iman dan ihtisab menjadi syarat mutlak terhapusnya dosa masa lalu", u: "Ihtisab artinya mengharap pahala hanya dari Allah tanpa mengeluh." },
            { id: 7, k: "Aqidah", j: "Merasakan Pengawasan Allah (Ihsan) Dalam Puasa", d: "Hadits Jibril tentang Ihsan", t: "kesadaran muroqobah kepada Allah", p: "Puasa melatih kesadaran bahwa Allah senantiasa mengawasi tiap detik kehidupan kita", u: "Sembahlah Allah seolah engkau melihat-Nya, jika tidak bisa maka yakinlah Dia melihatmu." },
            { id: 8, k: "Aqidah", j: "Iman Kepada Kitabullah dan Nuzulul Qur'an", d: "QS. Al-Baqarah: 185", t: "pengagungan terhadap wahyu Allah", p: "Al-Qur'an diturunkan sebagai petunjuk pembeda antara haq dan bathil", u: "Sebaik-baik kalian adalah yang mempelajari Al-Qur'an dan mengajarkannya." },
            { id: 9, k: "Aqidah", j: "Konsep Tawakal Dalam Menjalani Ibadah Ramadhan", d: "QS. At-Talaq: 3", t: "penyerahan diri penuh kepada takdir Allah", p: "Tawakal melahirkan ketenangan rohani dalam menghadapi ujian puasa", u: "Jika kalian bertawakal dengan sebenar-benarnya, Allah akan memberi rezeki seperti burung." },

            // IBADAH (10-18)
            { id: 10, k: "Ibadah", j: "Hikmah dan Fiqih Praktis Puasa Ramadhan", d: "QS. Al-Baqarah: 184", t: "pemahaman keabsahan ibadah puasa", p: "Fiqih mengajarkan kita batasan syarat, rukun, dan hal yang membatalkan puasa", u: "Menuntut ilmu fiqih ibadah adalah kewajiban sebelum melakukan amalan." },
            { id: 11, k: "Ibadah", j: "Menggapai Keutamaan Malam Lailatul Qadar", d: "QS. Al-Qadr: 1-5", t: "pencarian malam yang lebih baik dari 1000 bulan", p: "Ibadah pada malam Lailatul Qadar bernilai melampaui usia manusia", u: "Carilah Lailatul Qadar pada malam-malam ganjil di sepuluh hari terakhir Ramadhan." },
            { id: 12, k: "Ibadah", j: "Keutamaan dan Adab Shalat Tarawih", d: "HR. Bukhari & Muslim", t: "penegakan shalat malam secara khusyu'", p: "Qiyamu Ramadhan mengikis beban dosa dan menguatkan jiwa", u: "Shalatlah sebagaimana kalian melihat aku shalat dengan tumaninah." },
            { id: 13, k: "Ibadah", j: "Pentingnya Menjaga Shalat Fardhu Sebelum Sunnah", d: "QS. An-Nisa: 103", t: "prioritas amalan wajib atas sunnah", p: "Shalat fardhu adalah pokok agama yang pertama kali dihisab di hari kiamat", u: "Tidaklah hamba-Ku mendekatkan diri dengan sesuatu yang lebih Ku-cintai daripada amalan wajib." },
            { id: 14, k: "Ibadah", j: "Keberkahan Dalam Makan Sahur", d: "HR. Bukhari (Tasahharu fainna fis sahuri barakah)", t: "pengamalan sunnah sahur", p: "Sahur memberi kekuatan fisik dan keberkahan doa menjelang subuh", u: "Makan sahur adalah pembeda antara puasa kita dan puasa ahli kitab." },
            { id: 15, k: "Ibadah", j: "Adab dan Anjuran Menyegerakan Berbuka", d: "HR. Abu Dawud", t: "kedisiplinan waktu berbuka puasa", p: "Menyegerakan buka puasa saat maghrib tiba adalah bentuk ketaatan sunnah", u: "Manusia senantiasa berada dalam kebaikan selama mereka menyegerakan berbuka." },
            { id: 16, k: "Ibadah", j: "Keutamaan Itikaf di Masjid pada 10 Hari Terakhir", d: "HR. Bukhari tentang Itikaf", t: "penyucian hati dari kesibukan dunia", p: "Itikaf memfokuskan pikiran hanya untuk berzikir dan beribadah di rumah Allah", u: "Rasulullah SAW beritikaf di sepuluh hari terakhir Ramadhan hingga wafatnya." },
            { id: 17, k: "Ibadah", j: "Panduan Zakat Fitrah dan Pembagiannya", d: "QS. At-Taubah: 60", t: "pembersihan harta dan jiwa", p: "Zakat fitrah menyucikan kekhilafan puasa dan membahagiakan dhuafa", u: "Zakat fitrah diwajibkan sebagai penyuci bagi orang berpuasa dan makanan bagi orang miskin." },
            { id: 18, k: "Ibadah", j: "Meningkatkan Kuantitas dan Kualitas Tilawah", d: "QS. Fatir: 29", t: "interaksi rutin bersama Al-Qur'an", p: "Membaca Al-Qur'an dengan tadabbur memberikan syafaat di hari kiamat", u: "Bacalah Al-Qur'an karena ia akan datang memberi syafaat bagi pembacanya." },

            // MUAMALAH (19-26)
            { id: 19, k: "Muamalah", j: "Etika Bisnis dan Perdagangan di Bulan Ramadhan", d: "QS. An-Nisa: 29", t: "kejujuran dalam transaksi keuangan", p: "Ramadhan mengajarkan para pedagang untuk jujur dan tidak mengurangi timbangan", u: "Pedagang yang jujur dan terpercaya akan dikumpulkan bersama para nabi." },
            { id: 20, k: "Muamalah", j: "Indahnya Berbagi Melalui Sedekah dan Infak", d: "HR. Tirmidzi", t: "kedermawanan sosial", p: "Sedekah di bulan Ramadhan melipatgandakan rezeki dan menghapus dosa", u: "Sedekah yang paling utama adalah sedekah di bulan Ramadhan." },
            { id: 21, k: "Muamalah", j: "Menjauhi Riba dan Harta Haram Agar Puasa Diterima", d: "QS. Al-Baqarah: 275", t: "kebersihan konsumsi dari harta haram", p: "Harta haram menghalangi terkabulnya doa dan rusaknya amalan puasa", u: "Setiap daging yang tumbuh dari harta haram maka neraka lebih utama baginya." },
            { id: 22, k: "Muamalah", j: "Anjuran Membayar Hutang Sebelum Hari Raya", d: "HR. Ibn Majah", t: "penyelesaian kewajiban finansial", p: "Menunda pembayaran hutang bagi orang yang mampu adalah suatu kezaliman", u: "Jiwa seorang mukmin menggantung karena hutangnya sampai ditunaikan." },
            { id: 23, k: "Muamalah", j: "Pentingnya Menjaga Hak-Hak Tetangga", d: "HR. Bukhari", t: "keharmonisan hidup bertetangga", p: "Membagi hidangan berbuka kepada tetangga merupakan wujud iman", u: "Tidak beriman denganku orang yang kenyang sementara tetangganya kelaparan." },
            { id: 24, k: "Muamalah", j: "Gaya Hidup Sederhana dan Tidak Konsumtif", d: "QS. Al-A'raf: 31", t: "penghindaran sikap tabdzir dan israf", p: "Makan dan minum berlebihan saat berbuka merusak esensi puasa", u: "Sesungguhnya Allah tidak menyukai orang-orang yang berlebih-lebihan." },
            { id: 25, k: "Muamalah", j: "Manajemen Waktu Antara Kerja dan Ibadah", d: "QS. Al-Jumu'ah: 10", t: "keseimbangan dunia dan akhirat", p: "Bekerja mencari rezeki halal bernilai ibadah jika disertai niat yang benar", u: "Luangkan waktumu untuk beribadah kepada-Ku, niscaya Kuisikan dadamu dengan kekayaan." },
            { id: 26, k: "Muamalah", j: "Menjaga Amanah dan Profesionalisme Kerja", d: "QS. An-Nisa: 58", t: "integritas profesi saat berpuasa", p: "Puasa tidak boleh dijadikan alasan untuk bermalas-malasan dalam pekerjaan", u: "Sesungguhnya Allah menyukai jika seseorang bekerja, ia melakukannya dengan itqan (profesional)." },

        // Global State
        let currentKultum = null;
        let currentTab = 1;

        // Elements
        const kultumListEl = document.getElementById('kultumList');
        const categoryFilterEl = document.getElementById('categoryFilter');
        const mainContentEl = document.getElementById('mainContent');

        // Render Sidebar List
        function renderList(data) {
            kultumListEl.innerHTML = '';
            if (!Array.isArray(data) || data.length === 0) {
                kultumListEl.innerHTML = '<li style="cursor:default">Tidak ada data</li>';
                return;
            }

            data.forEach(item => {
                const li = document.createElement('li');
                li.textContent = `${item.id}. ${item.j}`;
                li.onclick = () => selectKultum(item.id);
                if (currentKultum && currentKultum.id === item.id) {
                    li.classList.add('active');
                }
                kultumListEl.appendChild(li);
            });
        }

        // Filter Function
        categoryFilterEl.addEventListener('change', (e) => {
            const cat = e.target.value;
            if (cat === 'ALL') {
                renderList(kultumData);
            } else {
                const filtered = kultumData.filter(x => x.k === cat);
                renderList(filtered);
            }
        });

        // Select Kultum Detail
        function selectKultum(id) {
            try {
                const item = kultumData.find(x => x.id === id);
                if (!item) return;

                currentKultum = item;
                currentTab = 1;

                const currentFilter = categoryFilterEl.value;
                const activeData = currentFilter === 'ALL' ? kultumData : kultumData.filter(x => x.k === currentFilter);
                renderList(activeData);

                renderContent();
            } catch (err) {
                console.error("Error selecting kultum:", err);
            }
        }

        // Render Main Content
        function renderContent() {
            if (!currentKultum) return;

            const fullText = buildFullScript(
                currentKultum.j,
                currentKultum.k,
                currentKultum.d,
                currentKultum.t,
                currentKultum.p,
                currentKultum.u,
                currentTab
            );

            mainContentEl.innerHTML = `
                <span class="badge">Kategori: ${escapeHtml(currentKultum.k)}</span>
                <h2 class="content-title">${currentKultum.id}. ${escapeHtml(currentKultum.j)}</h2>

                <div class="dalil-box">
                    <strong>Rujukan Dalil / Nukilan:</strong><br>
                    ${escapeHtml(currentKultum.d)}
                </div>

                <div class="tab-buttons">
                    <button class="tab-btn ${currentTab === 1 ? 'active' : ''}" onclick="switchTab(1)">Redaksi Khutbah A (Sistematis & Formal)</button>
                    <button class="tab-btn ${currentTab === 2 ? 'active' : ''}" onclick="switchTab(2)">Redaksi Khutbah B (Popular & Luwes)</button>
                </div>

                <div class="redaksi-box">${escapeHtml(fullText)}</div>

                <div class="action-buttons">
                    <button class="btn btn-gold" onclick="cetakKultum()">
                        <svg width="16" height="16" fill="currentColor" viewBox="0 0 16 16"><path d="M2.5 8a.5.5 0 1 0 0-1 .5.5 0 0 0 0 1z"/><path d="M5 1a2 2 0 0 0-2 2v2H2a2 2 0 0 0-2 2v3a2 2 0 0 0 2 2h1v1a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2v-1h1a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-1V3a2 2 0 0 0-2-2H5zM4 3a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2H4V3zm15 5a1 1 0 0 1 1 1v3a1 1 0 0 1-1 1h-1v-1a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v1H2a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h12zM5 11h6a1 1 0 0 1 1 1v2a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-2a1 1 0 0 1 1-1z"/></svg>
                        Cetak / Simpan Ke PDF
                    </button>
                </div>
            `;
        }

        function switchTab(tabIndex) {
            currentTab = tabIndex;
            renderContent();
        }

        function cetakKultum() {
            window.print();
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderList(kultumData);
        });
    </script>
