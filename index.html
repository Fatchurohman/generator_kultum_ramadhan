<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generator Kultum Ramadhan</title>
    <style>
        :root {
            --bg-primary: #0a2f1d;
            --bg-secondary: #124029;
            --accent-gold: #d4af37;
            --accent-gold-light: #f3e5ab;
            --text-light: #ffffff;
            --text-dark: #111111;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-light);
            min-height: 100vh;
            padding: 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            background: linear-gradient(135deg, var(--bg-secondary), #061c11);
            border: 2px solid var(--accent-gold);
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        h1 {
            color: var(--accent-gold);
            font-size: 1.8rem;
            text-shadow: 1px 1px 2px #000;
        }

        .developer-tag {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            color: var(--accent-gold-light);
            background: rgba(0,0,0,0.3);
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid var(--accent-gold);
        }

        .live-dot {
            width: 10px;
            height: 10px;
            background-color: #ff3333;
            border-radius: 50%;
            display: inline-block;
            animation: blink 1s infinite;
            box-shadow: 0 0 8px #ff3333;
        }

        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0.2; }
            100% { opacity: 1; }
        }

        .container {
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

        .sidebar {
            background: var(--bg-secondary);
            border: 1px solid var(--accent-gold);
            border-radius: 10px;
            padding: 15px;
            max-height: 80vh;
            overflow-y: auto;
        }

        .filter-container {
            margin-bottom: 15px;
        }

        select {
            width: 100%;
            padding: 10px;
            background-color: var(--bg-primary);
            color: var(--accent-gold-light);
            border: 1px solid var(--accent-gold);
            border-radius: 5px;
            outline: none;
        }

        .item-list {
            list-style: none;
        }

        .item-list li {
            padding: 12px;
            margin-bottom: 8px;
            background: rgba(0,0,0,0.2);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .item-list li:hover, .item-list li.active {
            background: var(--accent-gold);
            color: var(--text-dark);
            font-weight: bold;
        }

        .main-content {
            background: var(--bg-secondary);
            border: 1px solid var(--accent-gold);
            border-radius: 10px;
            padding: 25px;
            min-height: 80vh;
        }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            background-color: var(--accent-gold);
            color: var(--text-dark);
            border-radius: 15px;
            font-size: 0.8rem;
            font-weight: bold;
            margin-bottom: 10px;

        }

        .content-title {
            color: var(--accent-gold);
            margin-bottom: 15px;
            font-size: 1.5rem;
        }

        .tab-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--accent-gold);
            padding-bottom: 10px;
        }

        .tab-btn {
            background: transparent;
            color: var(--text-light);
            border: 1px solid var(--accent-gold);
            padding: 8px 16px;
            border-radius: 5px;
            cursor: pointer;
        }

        .tab-btn.active {
            background: var(--accent-gold);
            color: var(--text-dark);
            font-weight: bold;
        }

        .redaksi-box {
            background: rgba(0,0,0,0.2);
            padding: 20px;
            border-radius: 8px;
            border-left: 4px solid var(--accent-gold);
            line-height: 1.8;
            margin-bottom: 20px;
            white-space: pre-line;
        }

        .dalil-box {
            background: rgba(212, 175, 55, 0.1);
            border: 1px dashed var(--accent-gold);
            padding: 15px;
            border-radius: 5px;
            margin: 15px 0;
            font-style: italic;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-gold {
            background: linear-gradient(135deg, #d4af37, #f3e5ab);
            color: var(--text-dark);
        }

        .btn-gold:hover {
            filter: brightness(1.1);
        }

        .empty-state {
            text-align: center;
            padding: 50px;
            color: var(--accent-gold-light);
        }

        /* Print Style */
        @media print {
            body {
                background-color: #fff;
                color: #000;
            }
            header, .sidebar, .tab-buttons, .action-buttons, .filter-container {
                display: none !important;
            }
            .container {
                display: block;
            }
            .main-content {
                border: none;
                background: #fff;
                color: #000;
                padding: 0;
            }
            .content-title {
                color: #000;
            }
            .redaksi-box {
                background: #fff;
                color: #000;
                border-left: 2px solid #000;
            }
            .dalil-box {
                background: #fff;
                color: #000;
                border: 1px solid #000;
            }
            .badge {
                border: 1px solid #000;
                background: #fff;
                color: #000;
            }
        }
    </style>
</head>

            { id: 48, k: "Siyasah", j: "Keadilan Sosial dan Distribusi Kesejahteraan", d: "QS. Al-Hasyr: 7", r1: "Harta tidak boleh berputar di kalangan orang kaya saja...", r2: "Kebijakan politik anggaran harus memihak pada rakyat miskin..." },
            { id: 49, k: "Siyasah", j: "Etika Berpolitik dan Menghindari Politik Uang", d: "HR. Ahmad (Laki-laki yang menyuap dan disuap)", r1: "Politik uang merusak tatanan demokrasi dan hukum syariat...", r2: "Memilih pemimpin berdasarkan integritas dan kapasitas keilmuan..." },
            { id: 50, k: "Siyasah", j: "Mewujudkan Negeri Subur dan Pengampun (Baldatun Tayyibatun)", d: "QS. Saba: 15", r1: "Sinergi antara rakyat dan pemerintah dalam membangun negeri berkah...", r2: "Ramadhan sebagai pilar spiritual menuju peradaban yang berakhlak..." }
        ];

        // Global State
        let currentKultum = null;
        let currentTab = 1;

        // Elements
        const kultumListEl = document.getElementById('kultumList');
        const categoryFilterEl = document.getElementById('categoryFilter');
        const mainContentEl = document.getElementById('mainContent');

        // Render Sidebar List
        function renderList(data) {
            kultumListEl.innerHTML = '';
            if (!Array.isArray(data) || data.length === 0) {
                kultumListEl.innerHTML = '<li style="cursor:default">Tidak ada data</li>';
                return;
            }

            data.forEach(item => {
                const li = document.createElement('li');
                li.textContent = `${item.id}. ${item.j}`;
                li.onclick = () => selectKultum(item.id);
                if (currentKultum && currentKultum.id === item.id) {
                    li.classList.add('active');
                }
                kultumListEl.appendChild(li);
            });
        }

        // Filter Function
        categoryFilterEl.addEventListener('change', (e) => {
            const cat = e.target.value;
            if (cat === 'ALL') {
                renderList(kultumData);
            } else {
                const filtered = kultumData.filter(x => x.k === cat);
                renderList(filtered);
            }
        });

        // Select Kultum Detail
        function selectKultum(id) {
            try {
                const item = kultumData.find(x => x.id === id);
                if (!item) return;

                currentKultum = item;
                currentTab = 1;

                // Refresh Active List
                const currentFilter = categoryFilterEl.value;
                const activeData = currentFilter === 'ALL' ? kultumData : kultumData.filter(x => x.k === currentFilter);
                renderList(activeData);

                renderContent();
            } catch (err) {
                console.error("Error selecting kultum:", err);
            }
        }

        // Render Main Content
        function renderContent() {
            if (!currentKultum) return;

            const redaksiText = currentTab === 1 ? currentKultum.r1 : currentKultum.r2;

            mainContentEl.innerHTML = `
                <span class="badge">${escapeHtml(currentKultum.k)}</span>
                <h2 class="content-title">${currentKultum.id}. ${escapeHtml(currentKultum.j)}</h2>

                <div class="dalil-box">
                    <strong>Menukil Dalil / Referensi:</strong><br>
                    ${escapeHtml(currentKultum.d)}
                </div>

                <div class="tab-buttons">
                    <button class="tab-btn ${currentTab === 1 ? 'active' : ''}" onclick="switchTab(1)">Pilihan Redaksi 1</button>
                    <button class="tab-btn ${currentTab === 2 ? 'active' : ''}" onclick="switchTab(2)">Pilihan Redaksi 2</button>
                </div>

                <div class="redaksi-box">${escapeHtml(redaksiText)}</div>

                <div class="action-buttons">
                    <button class="btn btn-gold" onclick="cetakKultum()">
                        <svg width="16" height="16" fill="currentColor" viewBox="0 0 16 16"><path d="M2.5 8a.5.5 0 1 0 0-1 .5.5 0 0 0 0 1z"/><path d="M5 1a2 2 0 0 0-2 2v2H2a2 2 0 0 0-2 2v3a2 2 0 0 0 2 2h1v1a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2v-1h1a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-1V3a2 2 0 0 0-2-2H5zM4 3a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2H4V3zm15 5a1 1 0 0 1 1 1v3a1 1 0 0 1-1 1h-1v-1a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v1H2a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h12zM5 11h6a1 1 0 0 1 1 1v2a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-2a1 1 0 0 1 1-1z"/></svg>
                        Cetak / Simpan Ke PDF
                    </button>
                </div>
            `;
        }

        function switchTab(tabIndex) {
            currentTab = tabIndex;
            renderContent();
        }

        function cetakKultum() {
            window.print();
        }

        // Helper Escape HTML
        function escapeHtml(str) {
            if (!str) return '';
            return str
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // Initializing
        document.addEventListener('DOMContentLoaded', () => {
            renderList(kultumData);
        });
    </script>
</body>
</html>
